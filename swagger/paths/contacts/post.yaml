tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - isFavourite
          - contactType
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Travolta'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+380991234567'
          email:
            description: "Contact's email"
            type: string
            example: contact@somewhere.net
          photo:
            description: "Contact's photo file"
            type: string
            format: binary
          isFavourite:
            description: 'Whether is contact is favourite'
            type: boolean
            example: true
          contactType:
            description: "Contact's phone number description"
            type: string
            enum: ['work', 'home', 'personal']
responses:
  '201':
    description: 'Creates a contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contact.yaml'
  '400':
    $ref: '../../components/responses/400.yaml'

  '401':
    $ref: '../../components/responses/401.yaml'

  '500':
    $ref: '../../components/responses/500.yaml'
