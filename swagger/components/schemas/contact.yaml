type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - isFavourite
  - contactType
  - userId
  - createdAt
  - updatedAt

properties:
  _id:
    description: "Contact's id"
    type: string
    example: '65e4decdd286b30065d54af9'
  name:
    description: "Contact's name"
    type: string
    example: 'Mykola Veresen'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+380991234567'
  email:
    description: "Contact's email"
    type: string
    example: contact@somewhere.net
  photo:
    description: "Link to contact's photo"
    type: string
    example: 'https://res.cloudinary.com/uqwgdu/image/upload/image.png'
    default: null
  isFavourite:
    description: 'Whether is contact is favourite'
    type: boolean
    example: true
  contactType:
    description: "Contact's phone number description"
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "Contact's owner id"
    type: string
    example: 689633100da64db778cb1768
  createdAt:
    type: string
    format: date-time
    example: 2025-07-21T17:27:59.621+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-07-21T17:27:59.621+00:00
